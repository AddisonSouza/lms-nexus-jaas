<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <title>LMS Nexus</title>
</head>
<!--
  Layout base dos e-mails no design orgânico (tema claro). HTML de e-mail:
  tabelas e CSS inline, porque Gmail e Outlook descartam <style> e fontes web.
  Cada e-mail preenche os blocos title, body, actionLabel e note e passa o
  dado actionUrl, usado no botão e no endereço em texto.
-->
<body style="margin:0; padding:0; background-color:#f5ead8;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5ead8;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
          <tr>
            <td style="padding:0 8px 20px 8px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td width="36" height="36" align="center" valign="middle" style="width:36px; height:36px; background-color:#c67139; border-radius:18px; color:#fff2eb; font-family:Georgia, 'Times New Roman', serif; font-size:18px; font-weight:bold;">N</td>
                  <td style="padding-left:10px; font-family:Georgia, 'Times New Roman', serif; font-size:22px; font-weight:bold; color:#201e1d;">Nexus</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="background-color:#ebddc5; border-radius:28px; padding:36px 32px;">
              <h1 style="margin:0 0 16px 0; font-family:Georgia, 'Times New Roman', serif; font-size:26px; line-height:1.25; font-weight:bold; color:#201e1d;">{#insert title}{/}</h1>
              <div style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:16px; line-height:1.6; color:#201e1d;">{#insert body}{/}</div>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 24px 0;">
                <tr>
                  <td align="center" style="background-color:#c67139; border-radius:999px;">
                    <a href="{actionUrl}" target="_blank" style="display:inline-block; padding:14px 28px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:18px; font-weight:bold; color:#ffffff; text-decoration:none; border-radius:999px;">{#insert actionLabel}{/}</a>
                  </td>
                </tr>
              </table>
              <p style="margin:0 0 6px 0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:13px; line-height:1.5; color:#645c50;">Se o botão não funcionar, copie e cole este endereço no navegador:</p>
              <p style="margin:0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:13px; line-height:1.5; word-break:break-all;"><a href="{actionUrl}" target="_blank" style="color:#8c491a;">{actionUrl}</a></p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 8px 0 8px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:13px; line-height:1.5; color:#645c50;">
              <p style="margin:0 0 8px 0;">{#insert note}{/}</p>
              <p style="margin:0;">LMS Nexus · Este é um e-mail automático, não é preciso respondê-lo.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
