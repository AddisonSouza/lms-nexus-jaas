# Datasource
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME:root}
quarkus.datasource.password=${DB_PASSWORD:root}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/lms_db}

# Hibernate — NEVER use update in any profile
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# Redis
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
quarkus.redis.password=${REDIS_PASSWORD:redis}

# Mailer
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:1025}
quarkus.mailer.from=${MAIL_FROM:noreply@lms.local}
quarkus.mailer.username=${MAIL_USERNAME:}
quarkus.mailer.password=${MAIL_PASSWORD:}
quarkus.mailer.start-tls=DISABLED
quarkus.mailer.mock=false
# Dev: mock emails (no SMTP needed). Start Mailpit via docker compose up -d mailpit to receive real emails.
%dev.quarkus.mailer.mock=true

# Cookie — Secure=true required in prod; dev uses HTTP so Secure must be false
lms.cookie.secure=true
%dev.lms.cookie.secure=false

# JWT — dev uses key files in src/main/resources; prod injects via env vars
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=${JWT_ISSUER:https://lms.local}
smallrye.jwt.sign.key.location=privateKey.pem
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_PATH}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_PATH}

# OpenAPI
quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.path=/api/swagger-ui
%dev.quarkus.swagger-ui.always-include=true
%test.quarkus.swagger-ui.always-include=true

# BCrypt cost — override to 4 in test profile for speed
lms.security.bcrypt.cost=${BCRYPT_COST:12}

# Confirmation token TTL (hours)
lms.auth.confirmation-token.ttl-hours=24

# Virtual Threads
quarkus.rest.virtual-threads=true

# Storage — S3 / MinIO
quarkus.s3.aws.region=${STORAGE_REGION:us-east-1}
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${MINIO_ACCESS_KEY:minioadmin}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${MINIO_SECRET_KEY:minioadmin}
storage.bucket=${STORAGE_BUCKET:lms-dev}
storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:http://localhost:9000}
# Dev: point to MinIO container
%dev.quarkus.s3.endpoint-override=http://localhost:9000
%dev.quarkus.s3.path-style-access=true
# Test: point to MinIO Testcontainer (override in test if needed)
%test.quarkus.s3.endpoint-override=${MINIO_TEST_URL:http://localhost:9000}
%test.quarkus.s3.path-style-access=true
# Upload size limit
quarkus.http.limits.max-body-size=52428800

# --- Test profile ---
%test.quarkus.datasource.db-kind=mysql
%test.quarkus.datasource.username=test
%test.quarkus.datasource.password=test
%test.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3307/lms_test
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.mailer.mock=true
%test.lms.security.bcrypt.cost=4

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type
quarkus.http.cors.access-control-allow-credentials=true
lms.auth.password-reset.url=${PASSWORD_RESET_URL:http://localhost:5173/reset-password}
